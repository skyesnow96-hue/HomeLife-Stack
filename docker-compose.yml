services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      - "TZ=Newfoundland/St.John's"
    volumes:
      - ~/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro

  go2rtc:
    container_name: go2rtc
    image: alexxit/go2rtc
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /home/user1/homelab/go2rtc/go2rtc.yaml:/config/go2rtc.yaml

  broker:
    image: docker.io/library/redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  db:
    image: docker.io/library/postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: skyelove96
      POSTGRES_PASSWORD: One9nine6
    volumes:
      - pg-data:/var/lib/postgresql/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: skyelove96
      PAPERLESS_DBPASS: One9nine6
      PAPERLESS_DISABLE_REGULAR_SCHEDULES: true
      # Disable the machine learning classifier to prevent AVX/SIGILL crashes
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_ALLOWED_HOSTS: localhost,127.0.0.1,100.89.89.1,192.168.128.114
      PAPERLESS_URL: HTTP://192.168.128.114:8000
      PAPERLESS_CORS_ALLOWED_ORIGINS: http://100.89.89.1:8000,http://192.168.128.114:8000
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://100.89.89.1:8000,http://192.168.128.114:8000

      # Configuration Settings
      PAPERLESS_TIME_ZONE: America/Toronto
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_SECRET_KEY: change_this_to_a_long_random_string

      # Security / Reverse Proxy settings
      # PAPERLESS_URL: https://paperless.yourdomain.com
      # PAPERLESS_ALLOWED_HOSTS: paperless.yourdomain.com,192.168.x.x
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media          # Stores processed documents
      - ./export:/usr/src/paperless/export        # Backups / Exports
      - ./consume:/usr/src/paperless/consume      # Drop new files here to auto-process


volumes:
  redis-data:
  pg-data:

